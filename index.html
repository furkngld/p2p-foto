<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>P2P Foto</title>
<style>body{font-family:sans-serif;text-align:center;padding:14px}
input,button{font-size:17px;padding:8px;margin:6px;width:85%;max-width:340px}
textarea{width:92%;height:120px;font-size:9px}</style>
<h2>Foto Gönder</h2>
<input type=file id=f accept=image/*>
<button onclick=g()>Gönder</button>
<p id=s>Bağlanıyor...</p>
<textarea id=t readonly></textarea>
<button onclick="navigator.clipboard.writeText(t.value);this.textContent='✓ Kopyalandı'">Kopyala</button>
<script>
const fragment = location.hash.substring(1);
if (!fragment) { s.textContent = "QR'dan gelmediniz"; }
const O = JSON.parse(atob(fragment));
const pc = new RTCPeerConnection();
const ch = pc.createDataChannel("f");
ch.onopen = () => s.textContent = "Hazır! Dosya seçip Gönder'e bas.";
pc.setRemoteDescription(O)
  .then(() => pc.createAnswer())
  .then(a => pc.setLocalDescription(a))
  .then(() => t.value = JSON.stringify({
      sdp: pc.localDescription.sdp,
      type: pc.localDescription.type
  }))
  .catch(e => s.textContent = "Hata: " + e);

async function g() {
  const f1 = document.getElementById("f").files[0];
  if (!f1 || ch.readyState !== "open") { alert("Önce cevabı PC'ye yapıştır"); return; }
  ch.send("SIZE:" + f1.size);
  const b = await f1.arrayBuffer();
  for (let i = 0; i < b.byteLength; i += 65536) {
    if (ch.bufferedAmount > 1048576) await new Promise(r => setTimeout(r, 50));
    ch.send(b.slice(i, i + 65536));
  }
  s.textContent = "OK:" + f1.size;
}
</script>
